<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyMate</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1120;
color:#fff;
height:100vh;
}

.hidden{
display:none;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:15px;
margin-top:30px;
}

h1,h2{
text-align:center;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
outline:none;
border-radius:10px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.profile-id{
font-size:35px;
font-weight:bold;
text-align:center;
color:#22c55e;
margin:10px 0;
}

#messages{
height:400px;
overflow-y:auto;
padding:10px;
background:#0f172a;
border-radius:10px;
margin-bottom:10px;
}

.message{
background:#1f2937;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.time{
font-size:11px;
opacity:.7;
margin-top:5px;
text-align:right;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.online{
color:#22c55e;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage" class="card">

<h1>HeyMate</h1>

<input
type="text"
id="username"
placeholder="Enter Username"
/>

<button onclick="createProfile()">
Create Profile
</button>

</div>

<!-- PROFILE -->

<div id="profilePage" class="card hidden">

<h2 id="profileName"></h2>

<p style="text-align:center;">
Your Chat ID
</p>

<div id="myId" class="profile-id">
000
</div>

<input
type="number"
id="friendId"
placeholder="Enter Friend Chat ID"
/>

<button onclick="connectUser()">
Connect User
</button>

</div>

<!-- CHAT -->

<div id="chatPage" class="card hidden">

<div class="header">

<div>
<h3 id="chatUser">
Private Chat
</h3>
</div>

<div class="online">
Online
</div>

</div>

<div id="messages"></div>

<input
type="text"
id="messageInput"
placeholder="Type message..."
/>

<button onclick="sendMessage()">
Send Message
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
addDoc,
query,
orderBy,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBlH9hbLBGFpoZmHpaClLnlpX0KtMlw5dY",

authDomain: "heymate-2a25f.firebaseapp.com",

projectId: "heymate-2a25f",

storageBucket: "heymate-2a25f.firebasestorage.app",

messagingSenderId: "593737033747",

appId: "1:593737033747:web:60e2bfb512593582b3f7e6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let currentUser = "";
let currentId = "";
let currentChat = "";

window.createProfile = async function(){

const username =
document.getElementById("username").value;

if(!username) return;

currentUser = username;

currentId =
Math.floor(
100000 + Math.random()*900000
).toString();

await setDoc(
doc(db,"users",currentId),
{
username,
id:currentId
}
);

document.getElementById("profileName")
.innerText=username;

document.getElementById("myId")
.innerText=currentId;

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("profilePage")
.classList.remove("hidden");

};
window.connectUser = async function(){

const friendId =
document.getElementById("friendId").value;

if(!friendId){
alert("Enter Friend ID");
return;
}

const friendDoc =
await getDoc(doc(db,"users",friendId));

if(!friendDoc.exists()){
alert("User Not Found");
return;
}

const friendData = friendDoc.data();

document.getElementById("chatUser")
.innerText = friendData.username;

currentChat =
[currentId,friendId]
.sort()
.join("_");

document.getElementById("profilePage")
.classList.add("hidden");

document.getElementById("chatPage")
.classList.remove("hidden");

loadMessages();

};

window.sendMessage = async function(){

const input =
document.getElementById("messageInput");

const text = input.value.trim();

if(!text) return;

await addDoc(
collection(
db,
"chats",
currentChat,
"messages"
),
{
sender: currentUser,
senderId: currentId,
text: text,
time: Date.now()
}
);

input.value="";

};

function loadMessages(){

const q = query(
collection(
db,
"chats",
currentChat,
"messages"
),
orderBy("time")
);

onSnapshot(q,(snapshot)=>{

const messages =
document.getElementById("messages");

messages.innerHTML="";

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

const time =
new Date(data.time)
.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

const div =
document.createElement("div");

div.className="message";

div.innerHTML = `
<b>${data.sender}</b>
<div>${data.text}</div>
<div class="time">${time}</div>
`;

messages.appendChild(div);

});

messages.scrollTop =
messages.scrollHeight;

});

}

document
.getElementById("messageInput")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){
sendMessage();
}

});

</script>

</body>
</html>
