<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyMate</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.screen{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:#181818;
padding:30px;
border-radius:15px;
width:90%;
max-width:400px;
box-shadow:0 0 20px rgba(0,255,0,0.15);
text-align:center;
}

h1{
margin-bottom:20px;
color:#00ff88;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
background:#252525;
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#00ff88;
color:black;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:.9;
}

#chatScreen{
display:none;
flex-direction:column;
height:100vh;
width:100%;
}

.topbar{
background:#181818;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
border-bottom:1px solid #333;
}

#messages{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
background:#1f1f1f;
padding:10px;
border-radius:10px;
max-width:80%;
word-wrap:break-word;
}

.mine{
align-self:flex-end;
background:#00aa55;
color:white;
}

.sender{
font-size:12px;
opacity:.7;
margin-bottom:4px;
}

.inputArea{
display:flex;
padding:10px;
background:#181818;
gap:10px;
}

.inputArea input{
margin:0;
flex:1;
}

.inputArea button{
width:100px;
margin:0;
}
</style>
</head>

<body>

<div id="loginScreen" class="screen">
<div class="card">
<h1>HeyMate</h1>

<input type="text" id="username" placeholder="Enter Username">

<input type="password" id="roomCode" placeholder="Enter Code">

<button onclick="joinChat()">Join Chat</button>

<p style="margin-top:15px;color:#aaa;">
Room Code: <b>7856</b>
</p>
</div>
</div>

<div id="chatScreen">
<div class="topbar">
HeyMate Chat Room (7856)
</div>

<div id="messages"></div>

<div class="inputArea">
<input type="text" id="messageInput" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBlH9hbLBGFpoZmHpaClLnlpX0KtMlw5dY",
authDomain: "heymate-2a25f.firebaseapp.com",
projectId: "heymate-2a25f",
storageBucket: "heymate-2a25f.firebasestorage.app",
messagingSenderId: "593737033747",
appId: "1:593737033747:web:60e2bfb512593582b3f7e6",
measurementId: "G-Q7Q9HY2H1C"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.currentUser = "";

window.joinChat = function(){

const username =
document.getElementById("username").value.trim();

const code =
document.getElementById("roomCode").value.trim();

if(!username){
alert("Enter username");
return;
}

if(code !== "7856"){
alert("Wrong code");
return;
}

window.currentUser = username;

document.getElementById("loginScreen").style.display="none";
document.getElementById("chatScreen").style.display="flex";

loadMessages();
};

window.sendMessage = async function(){

const input =
document.getElementById("messageInput");

const text = input.value.trim();

if(!text) return;

await addDoc(
collection(db,"messages"),
{
username: currentUser,
text:text,
timestamp: Date.now()
}
);

input.value="";
};

function loadMessages(){

const q = query(
collection(db,"messages"),
orderBy("timestamp")
);

onSnapshot(q,(snapshot)=>{

const box =
document.getElementById("messages");

box.innerHTML="";

snapshot.forEach((doc)=>{

const data = doc.data();

const msg =
document.createElement("div");

msg.classList.add("message");

if(data.username === currentUser){
msg.classList.add("mine");
}

msg.innerHTML=
`
<div class="sender">${data.username}</div>
<div>${data.text}</div>
`;

box.appendChild(msg);

});

box.scrollTop = box.scrollHeight;

});
}

</script>

</body>
</html>
